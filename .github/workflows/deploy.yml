name: Auto Deploy to GoDaddy via SFTP

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build

      - name: SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: 22
          username: ${{ secrets.SFTP_USER }}
          private_key: ${{ secrets.SFTP_KEY }} # Your PRIVATE key, not public
          local_path: './dist/*' # if Vite → change to ./dist/*
          remote_path: '/home/USERNAME/public_html/'
